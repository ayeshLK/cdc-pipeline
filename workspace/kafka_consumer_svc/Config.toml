# Cache enricher configurations
[cache_enricher.kafka]
bootstrapServers = "localhost:9092"
deadLetterTopic = "dl-meta_info"

[cache_enricher.redis]
host = "localhost"
port = 6379
cacheExpiryInterval = 3600

[cache_enricher]
livenessInterval = 90.0

# Stream processor configurations
[stream_processor.kafka]
bootstrapServers = "localhost:9092"
deadLetterItemsTopic = "dl-order_items"
deadLetterAnalysisTopic = "dl-sales_analysis"

[stream_processor.redis]
host = "localhost"
port = 6379
cacheExpiryInterval = 3600

[stream_processor]
livenessInterval = 90.0

[analyticsdb]
host = "localhost"
port = 3307
user = "root"
password = "root"
database = "analytics_db"

# HTTP configurations
[ballerina.http]
defaultListenerPort = 19092
